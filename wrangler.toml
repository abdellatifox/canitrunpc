name = "canitrunpc"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# --------------------------------------------------------------------------
# Cloudflare account: "Abdellatifsite1@gmail.com's Account"
# (cc118d2cb25a7e0653c9839f20efa92f). Resources created 2026-09-15.
# This is NOT the RunsOnMyPC (Abdellatifox1000) or PCGameFit account, and never
# the Abdellatifbrands account or anything named critvolt-*.
#
# Run wrangler only through the token wrapper, which reads the git-ignored
# .cloudflare/token.txt and .cloudflare/account.txt:
#   npm run cf -- whoami
#   npm run db:migrate
#
# KV titles carry a doubled prefix ("canitrunpc-canitrunpc-tools") because
# wrangler v3 prefixes namespace titles with the project name. Cosmetic only;
# bindings resolve by id.
# --------------------------------------------------------------------------

[[d1_databases]]
binding = "DB"
database_name = "canitrunpc-db"
database_id = "d42cbcc3-3abf-4d5e-ae0f-868fe4574e51"
migrations_dir = "migrations"

# Caches tool and autocomplete results. Optional: the APIs query directly when
# this namespace is missing or erroring.
[[kv_namespaces]]
binding = "TOOLS_KV"
id = "44d3fa3e853a46f4b96d50473eead1e3"

# Required by @astrojs/cloudflare's session support. Without it the build
# warns "Invalid binding `SESSION`".
[[kv_namespaces]]
binding = "SESSION"
id = "a53742ee6a7b4d7fb352016950fc0723"

# R2 is deliberately unused. Game art ships as Pages static assets, which the
# same edge serves with no egress cost and no Worker invocation.
#
# Revisit near Pages' 20,000-file cap (~5.9 files per game, so ~3,300 games).
# Before switching: create a Cache Rule for the CDN hostname (R2 custom-domain
# traffic is not edge-cached without one), then set ART_BASE in src/lib/site.ts.
#
# [[r2_buckets]]
# binding = "ART_R2"
# bucket_name = "canitrunpc-assets"
